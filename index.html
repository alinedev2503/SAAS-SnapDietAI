<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket errors in cloud dev iframe environment (HMR is disabled)
      (function () {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function (url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1))) {
              var listeners = {};
              var dummy = {
                readyState: 1,
                send: function () {},
                close: function () {},
                addEventListener: function (type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function () { fn({ type: 'open' }); }, 0);
                  }
                },
                removeEventListener: function (type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function (f) { return f !== fn; });
                  }
                },
                dispatchEvent: function () { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return dummy;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) { return (a && a.message) || String(a); }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = (e && e.message) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriLense AI — Scanner Nutricional e Leitura de Rótulos por IA</title>
    <meta name="description" content="Plataforma SaaS White-Label de inteligência nutricional por IA com leitura de rótulos e códigos de barras, alertas de restrições alimentares, substituições saudáveis e relatórios em PDF." />

    <meta property="og:description" content="Análise instantânea de rótulos, tabela nutricional, aditivos e substituições saudáveis personalizadas." />
